name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            out: find-uncommitted
            helper: fix-ownership
          - goos: linux
            goarch: arm64
            out: find-uncommitted
            helper: fix-ownership
          - goos: windows
            goarch: amd64
            out: find-uncommitted.exe
            helper: fix-ownership.exe
          - goos: darwin
            goarch: amd64
            out: find-uncommitted
            helper: fix-ownership
          - goos: darwin
            goarch: arm64
            out: find-uncommitted
            helper: fix-ownership
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build find-uncommitted (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p binaries
          go build -o "binaries/${{ matrix.out }}" .
          go build -o "binaries/${{ matrix.helper }}" ./fix-ownership-tool
      - name: Verify binaries
        run: ls -la binaries/
